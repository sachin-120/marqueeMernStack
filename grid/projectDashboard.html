<!DOCTYPE html>
<html>
    <head>
        <title></title>

        <style>
            
            .container{
                display:grid;
                width:1000px;
                grid-template-columns:repeat(3,1fr);
                grid-template-rows:200px 200px 200px;
                gap:15px;
                margin:100px auto
            }

            .color{
                overflow: hidden;
                position:relative;
                background-position:center;
            }

            .container>div{
                /* border:2px solid black; */
                border-radius:15px ;
            }

            .purple{
                background: #cbb8ff;
                grid-row: 1/3;
                grid-column: 1;
            }


            .green{
                background: #d9ef9f;
                overflow:hidden;
                    /* grid-column: 2;
                    grid-row: 2; */
            }

            .wallet{
                display:flex;
                justify-content: center;
                align-items: center;
                /* background: transparent;     */
                /* display:grid;
                place-items: center; */
                
            }

            .wallet img{
                width:65%;
                object-fit: contain;
                display: block;   
            }

            .walletDes{
                width:90%;
                margin:auto;
            }

            .yellow{
                background: #f8df6d;
                overflow: hidden;
                    /* grid-column: 3;
                    grid-row: 2; */
            }

            .inbox{
                width:90%;
                margin:auto;
            }
            
            .inbox h2{
                 margin-bottom: 4px;
            }

            .inbox p {
                margin-top: 0;
            }
            
            .inboxPart2{
                width:90%;
                margin:auto;  
            }

            .inboxPart2>img{
                width:65%;
                height:100%;
                object-fit: contain;
                display: block;      
            }

        
            .pink{
                grid-column:2/4;
                background-color: pink;
            }

            .orange{
                grid-column:1/3;
                background: #f8b27d;
            }

            .blue{
                 grid-column: 3;
                 grid-row: 3;
                 background: #c7dceb;
            }

        </style>

    </head>
    <body>

        <main>

        <div class="container">
            <div class="purple"></div>
            <div class="pink"></div>
            <div class="color green">
                <!-- <div class="wallet">
                    <img src="assetsProjectDashboard/walletPic2.png">
                    </div>
                    <div class="walletDes">
                    <p><strong style="font-size: 20px;">Wallet</strong><br>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit</p>
                    </div> -->
                </div>
            <div class="yellow">
                <!-- <div class="inbox">
                    <h2>Inbox</h2>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit</p>
                </div>
                <div class="inboxPart2">
                    <img src="assetsProjectDashboard/inboxPic.jpg">
                </div> -->
            </div>
            <div class="orange"></div>
            <div class="blue"></div>
        </div>

        </main>

    </body>

</html>
